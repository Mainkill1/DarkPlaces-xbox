name: Xbox port bug
description: Report a reproducible failure in an implemented Xbox port gate.
title: "[Xbox bug] "
labels: []
body:
  - type: input
    id: commit
    attributes:
      label: Fork commit
    validations:
      required: true
  - type: input
    id: nxdk
    attributes:
      label: nxdk revision
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - xemu
        - Retail 64 MB Xbox
        - Upgraded 128 MB Xbox
        - Build/CI only
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, captures, and telemetry
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Build/content profile
      description: Video mode, debug/release, content pack, camera path, memory profile, and loop/marker.
