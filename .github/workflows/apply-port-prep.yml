name: Apply Original Xbox port preparation

on:
  push:
    branches:
      - master
    paths:
      - '.github/port-prep.part-*'
      - '.github/workflows/apply-port-prep.yml'

permissions:
  contents: write

concurrency:
  group: apply-original-xbox-port-preparation
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'Mainkill1/DarkPlaces-xbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and reconstruct preparation payload
        run: |
          cat > /tmp/part-checksums <<'EOF'
          1e7d852bcd6ab451d253f21e2edf0abc4651ec249f1cdbc4d2dc8d765a619d12  .github/port-prep.part-00
          69b0616778e0e6c7810fa8ebaf076481a141f3e031bbd0d8b6e4938cecec30c2  .github/port-prep.part-01
          7f9d740a72403a38f87c90f0a828795d4eaadce037cec397f2d91c3579b9f1a5  .github/port-prep.part-02
          2cd8aa1bcf7cffff65e556c252e69997b6a8ca524cb6c9588bdb5fe299ced15e  .github/port-prep.part-03
          d4fb2c45696276eb72a24711e5f2060abb74a35c1ddc85a27688b0a188551144  .github/port-prep.part-04
          8d513ad8b5336c8a868953d3471af83300a1f5481685a65ae43a95fb32e19ab5  .github/port-prep.part-05
          60c1f1fd29ab8397a89e3157915aa3595c44e06174fcd9a4a9d4e17e197d2c11  .github/port-prep.part-06
          EOF
          sha256sum --check /tmp/part-checksums
          cat \
            .github/port-prep.part-00 \
            .github/port-prep.part-01 \
            .github/port-prep.part-02 \
            .github/port-prep.part-03 \
            .github/port-prep.part-04 \
            .github/port-prep.part-05 \
            .github/port-prep.part-06 \
            > /tmp/port-prep.b64
          base64 --decode /tmp/port-prep.b64 > /tmp/port-prep.tar.xz
          echo '52903bf3ec7977fafc2a3741741accff015d91fa8086ac0f0bf02e2e97f019a0  /tmp/port-prep.tar.xz' | sha256sum --check -
          tar -xJf /tmp/port-prep.tar.xz -C .
          chmod +x tools/bootstrap_port_issues.py tools/publish_wiki.sh

      - name: Validate generated repository content
        run: |
          python3 -m py_compile tools/bootstrap_port_issues.py
          python3 tools/bootstrap_port_issues.py --validate-only
          python3 -m json.tool .github/port-issues.json >/dev/null
          bash -n tools/publish_wiki.sh
          python3 - <<'PY'
          import re
          from pathlib import Path

          wiki = Path('wiki')
          pages = {path.stem for path in wiki.glob('*.md')}
          missing = []
          pattern = re.compile(r'\[[^]]+\]\(([^)]+)\)')
          for path in wiki.glob('*.md'):
              for target in pattern.findall(path.read_text(encoding='utf-8')):
                  if '://' in target or target.startswith('#'):
                      continue
                  clean = target.split('#', 1)[0]
                  if clean.endswith('.md'):
                      clean = Path(clean).stem
                  if clean and clean not in pages:
                      missing.append(f'{path}: {target}')
          if missing:
              raise SystemExit('Missing wiki pages:\n' + '\n'.join(missing))
          print(f'validated {len(pages)} wiki pages')
          PY

      - name: Commit prepared repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md PORTING.md AGENTS.md .gitignore xbox wiki tools \
            .github/PULL_REQUEST_TEMPLATE.md \
            .github/ISSUE_TEMPLATE \
            .github/port-issues.json \
            .github/workflows/bootstrap-port-issues.yml \
            .github/workflows/publish-wiki.yml \
            .github/workflows/port-repository-checks.yml
          git diff --cached --check
          git commit -m 'chore: prepare repository for Original Xbox port'
          git push origin HEAD:master
