name: Port repository checks

on:
  push:
    branches:
      - master
    paths:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/port-repository-checks.yml'
      - '.github/workflows/publish-wiki.yml'
      - 'tools/publish_wiki.sh'
      - 'wiki/**'
      - 'README.md'
      - 'PORTING.md'
      - 'AGENTS.md'
  pull_request:
    paths:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/port-repository-checks.yml'
      - '.github/workflows/publish-wiki.yml'
      - 'tools/publish_wiki.sh'
      - 'wiki/**'
      - 'README.md'
      - 'PORTING.md'
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject obsolete duplicate-roadmap bootstrap files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          obsolete = [
              Path(".github/port-issues.json"),
              Path(".github/workflows/bootstrap-port-issues.yml"),
              Path("tools/bootstrap_port_issues.py"),
          ]
          present = [str(path) for path in obsolete if path.exists()]
          if present:
              raise SystemExit(
                  "Obsolete duplicate-roadmap files are present:\n"
                  + "\n".join(present)
              )
          print("no obsolete issue bootstrap files")
          PY

      - name: Validate shell scripts
        run: bash -n tools/publish_wiki.sh

      - name: Validate wiki links and live issue map
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          wiki = Path("wiki")
          pages = {path.stem for path in wiki.glob("*.md")}
          missing = []
          pattern = re.compile(r"\[[^]]+\]\(([^)]+)\)")

          for path in wiki.glob("*.md"):
              for target in pattern.findall(path.read_text(encoding="utf-8")):
                  if "://" in target or target.startswith("#"):
                      continue
                  clean = target.split("#", 1)[0]
                  if clean.endswith(".md"):
                      clean = Path(clean).stem
                  if clean and clean not in pages:
                      missing.append(f"{path}: {target}")

          if missing:
              raise SystemExit("Missing wiki pages:\n" + "\n".join(missing))

          issue_map = (wiki / "Issue-Map.md").read_text(encoding="utf-8")
          expected = {
              f"https://github.com/Mainkill1/DarkPlaces-xbox/issues/{number}"
              for number in range(1, 31)
          }
          absent = sorted(url for url in expected if url not in issue_map)
          if absent:
              raise SystemExit(
                  "Issue map is missing live issue links:\n"
                  + "\n".join(absent)
              )

          print(f"validated {len(pages)} wiki pages and issues #1-#30")
          PY
