name: Playable Nexuiz Xbox

on:
  workflow_dispatch:
  push:
    branches:
      - port/nexuiz-playable-lan
    paths:
      - 'xbox/classic/**'
      - 'xbox/release/**'
      - 'tools/xbox/release_inputs.py'
      - 'tools/xbox/stage_classic_release.py'
      - '.github/workflows/xbox-playable.yml'

permissions:
  contents: read

jobs:
  build-game:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld cmake flex bison pkgconf git python3 curl

      - name: Acquire and verify immutable release inputs
        shell: bash
        run: |
          set -euo pipefail
          make -C xbox/release bootstrap

      - name: Build and package release candidate
        shell: bash
        run: |
          set -euo pipefail
          make -C xbox/release all

      - name: Show release identity and checksums
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cat xbox/release/out/BUILD-IDENTITY.txt
          cat xbox/release/out/SHA256SUMS

      - name: Upload playable game image
        uses: actions/upload-artifact@v4
        with:
          name: nexuiz-xbox-playable
          if-no-files-found: error
          compression-level: 0
          path: xbox/release/out/
